<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 1. Etiquetas para mitigar la caché del navegador -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Script de model-viewer requerido -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <!-- 2. Script de auto-recarga global -->
  <script>
    setInterval(async () => {
      try {
        const response = await fetch('./version.json?_=' + Date.now());
        const data = await response.json();
        const currentVersion = localStorage.getItem('mophra_version');
        
        if (!currentVersion) {
          localStorage.setItem('mophra_version', data.version);
        } else if (currentVersion !== data.version) {
          localStorage.setItem('mophra_version', data.version);
          window.location.reload();
        }
      } catch (err) {
        // Silenciar errores de conexión temporal
      }
    }, 60000);
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOPHRA</title>
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <style>
    @font-face {
      font-family: 'RelicusMono';
      src: url('https://res.cloudinary.com/dfhrxq0tf/raw/upload/v1784479120/Relicus-Mono_rsjgnn.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

   /* 🛑 BLOQUEAR SCROLLBAR HORIZONTAL GLOBAL */
   html, body, #wrapper, #main, .container {
      margin: 0;
      padding: 0;
      background-color: #F5260A; /* Fondo rojo característico */
      font-family: 'RelicusMono', monospace;
      min-height: 100vh;
      overflow-x: hidden !important;
      max-width: 100vw !important;
      box-sizing: border-box;
    }

    /* 🖍️ PERSONALIZAR COLOR DE SELECCIÓN / RESALTADOR */
    *::selection,
    ::selection {
      background-color: #fae100; /* Color amarillo neón */
      color: #030303; /* Color de texto oscuro */
    }

    /* --- Estilos del Menú Global MOPHRA --- */
    .mophra-global-container {
      position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
      width: 100% !important; height: 100vh !important;
      background-color: transparent !important;
      overflow: hidden !important;
      overflow-x: hidden !important;
      font-family: 'RelicusMono', monospace !important; user-select: none !important; z-index: 999999 !important; pointer-events: none !important;
    }

    @keyframes entradaBoton { 0% { transform: translateY(-100px); opacity: 0; } 70% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes salidaBoton { 0% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }

    .mophra-global-btn {
      position: fixed !important; top: 30px !important; right: 30px !important; z-index: 1000000 !important;
      background: rgba(255, 255, 255, 0.1) !important; border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-radius: 50% !important; width: 70px !important; height: 70px !important; cursor: pointer !important;
      display: flex !important; align-items: center !important; justify-content: center !important;
      backdrop-filter: blur(5px) !important; pointer-events: auto !important; padding: 0 !important; opacity: 0 !important;
      transition: background 0.3s, transform 0.3s !important;
    }

    .mophra-global-btn.animar-entrada { opacity: 1 !important; animation: entradaBoton 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
    .mophra-global-btn.animar-salida { opacity: 1 !important; animation: salidaBoton 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
    .mophra-global-btn:hover { background: rgba(255, 255, 255, 0.25) !important; transform: scale(1.05) !important; }

    .mophra-svg-element { width: 62px !important; height: 62px !important; display: block !important; transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none; }
    #mophraVectorPath { transition: opacity 0.2s ease, d 0.2s ease; }
    .mophra-global-container.menu-open .mophra-svg-element { transform: rotate(180deg); }
    .mophra-global-container.menu-open { pointer-events: auto !important; }

    /* 🖤 FONDO NEGRO DESLIZANTE */
    .mophra-global-overlay {
      position: absolute !important;
      top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important;
      background-color: #000000 !important;
      transform: translateX(100%) !important;
      transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1) !important;
      pointer-events: none !important;
    }

    .mophra-global-container.menu-open .mophra-global-overlay { transform: translateX(0) !important; pointer-events: auto !important; }

    /* 🧭 CONTENEDOR DE NAVEGACIÓN */
    .mophra-signs-nav {
      position: absolute !important; right: 0 !important; top: 0 !important; height: 100% !important; max-height: 100vh !important;
      display: flex !important; flex-direction: column !important; align-items: flex-end !important;
      padding-right: 40px !important;
      padding-top: 130px !important;
      padding-bottom: 30px !important; box-sizing: border-box !important;
      z-index: 100000 !important; pointer-events: none !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
    }

    .mophra-global-container.menu-open .mophra-signs-nav { pointer-events: auto !important; }

    /* ➡️ ANIMACIÓN SLIDE DE DERECHA A IZQUIERDA */
    .mophra-sign-item {
      display: block !important; color: #ffffff !important; text-decoration: none !important; text-transform: uppercase !important;
      font-weight: 900 !important; font-size: clamp(40px, 5.5vw, 80px) !important; line-height: 0.92 !important; letter-spacing: -2px !important;
      transform: translateX(100vw) !important;
      transform-origin: right center !important; width: max-content !important;
      pointer-events: none !important; visibility: hidden !important;
      transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1), color 0.1s ease 0s, visibility 0s linear 0.4s !important;
    }

    .mophra-global-container.menu-open .mophra-sign-item {
      transform: translateX(0) !important;
      pointer-events: auto !important;
      visibility: visible !important;
    }

    .mophra-global-container.menu-open .mophra-sign-item:nth-child(1) { transition-delay: 0.15s, 0s, 0.15s !important; }
    .mophra-global-container.menu-open .mophra-sign-item:nth-child(2) { transition-delay: 0.22s, 0s, 0.22s !important; }
    .mophra-global-container.menu-open .mophra-sign-item:nth-child(3) { transition-delay: 0.29s, 0s, 0.29s !important; }
    .mophra-global-container.menu-open .mophra-sign-item:nth-child(4) { transition-delay: 0.36s, 0s, 0.36s !important; }
    .mophra-global-container.menu-open .mophra-sign-item:nth-child(5) { transition-delay: 0.43s, 0s, 0.43s !important; }

    a.mophra-sign-item:hover, .mophra-sign-link:hover { color: #969696 !important; }

    /* 🎬 ICONO DE SUBMENÚ */
    .mophra-dropdown-wrapper { display: flex !important; flex-direction: column !important; align-items: flex-end !important; }
    .mophra-sign-header { display: flex !important; align-items: center !important; justify-content: flex-end !important; gap: 18px !important; width: 100% !important; }
    .mophra-sign-link { color: inherit !important; text-decoration: none !important; }
    .mophra-submenu-toggle { background: none !important; border: none !important; cursor: pointer !important; padding: 0 !important; display: flex !important; align-items: center !important; }

    .mophra-frolov-icon {
      width: clamp(28px, 3.8vw, 44px) !important;
      height: clamp(20px, 3vw, 30px) !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      position: relative !important;
    }

    .mophra-frolov-icon span {
      display: block !important;
      height: clamp(3px, 0.4vw, 5px) !important;
      background-color: #ffffff !important;
      border-radius: 10px !important;
      transition: transform 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.25s ease, width 0.3s ease, margin 0.3s ease !important;
      transform-origin: center !important;
    }
    .mophra-frolov-icon .line-top { width: 40% !important; margin-right: auto !important; margin-left: 0 !important; }
    .mophra-frolov-icon .line-mid { width: 100% !important; margin-left: auto !important; }
    .mophra-frolov-icon .line-bot { width: 60% !important; margin-left: auto !important; }

    .mophra-dropdown-wrapper.submenu-open .mophra-frolov-icon .line-top {
      width: 100% !important; margin-left: 0 !important;
      transform: translateY(calc(clamp(20px, 3vw, 30px) / 2 - clamp(3px, 0.4vw, 5px) / 2)) rotate(45deg) !important;
    }
    .mophra-dropdown-wrapper.submenu-open .mophra-frolov-icon .line-mid { opacity: 0 !important; transform: scaleX(0) !important; }
    .mophra-dropdown-wrapper.submenu-open .mophra-frolov-icon .line-bot {
      width: 100% !important; margin-left: 0 !important;
      transform: translateY(calc(-1 * (clamp(20px, 3vw, 30px) / 2 - clamp(3px, 0.4vw, 5px) / 2))) rotate(-45deg) !important;
    }

    .mophra-submenu {
      display: flex !important; flex-direction: column !important; align-items: flex-end !important;
      max-height: 0 !important; overflow: hidden !important; opacity: 0 !important;
      transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease !important; margin-top: 0px !important;
      padding-left: 20px !important;
    }
    .mophra-dropdown-wrapper.submenu-open .mophra-submenu { max-height: 300px !important; opacity: 1 !important; margin-top: 10px !important; }

    .mophra-sub-item {
      color: #a0a0a0 !important; text-decoration: none !important; text-transform: lowercase !important;
      font-size: clamp(20px, 3vw, 36px) !important; padding: 4px 0 !important;
      transition: color 0.2s ease, transform 0.2s ease !important; display: block !important;
    }
    .mophra-sub-item:hover { color: #ffffff !important; transform: translateX(-5px) !important; }

    /* ==========================================================
        🌍 ESTILOS DEL MENÚ FLOTANTE DE REDES SOCIALES (IZQUIERDA)
        ========================================================== */
    @keyframes slideInFromLeft {
      0% { opacity: 0; transform: translateX(-50px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes typing {
      from { max-width: 0; }
      to { max-width: 200px; }
    }
    @keyframes blink-caret {
      from, to { opacity: 0; }
      50% { opacity: 1; }
    }
    @keyframes hide-cursor {
      to { width: 0; margin: 0; opacity: 0; display: none; }
    }
    @keyframes reveal-item {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .clean-social-menu {
      position: fixed !important;
      top: 30px !important;
      left: 20px !important;
      z-index: 999998 !important;
      pointer-events: auto !important;
      font-family: 'RelicusMono', monospace !important;
      display: inline-block !important;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s ease !important;
      -webkit-tap-highlight-color: transparent;
    }
    .clean-social-menu.section-active {
      visibility: visible !important;
      animation: slideInFromLeft 1.2s cubic-bezier(0.16, 1, 0.3, 1) both !important;
      animation-delay: 0.1s !important;
    }

    .menu-trigger-btn {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      color: #ffffff !important;
      width: 42px !important;
      height: 42px !important;
      cursor: pointer !important;
      border-radius: 50% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      backdrop-filter: blur(4px) !important;
      -webkit-backdrop-filter: blur(4px) !important;
      transition: all 0.3s ease !important;
      padding: 0 !important;
      outline: none !important;
    }
    .world-svg {
      width: 20px;
      height: 20px;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s ease;
    }
    @media (hover: hover) {
      .menu-trigger-btn:hover {
        background: rgba(255, 255, 255, 0.2) !important;
      }
      .menu-trigger-btn:hover .world-svg {
        color: #fae100 !important;
      }
    }

    .menu-dropdown-box {
      position: absolute !important;
      top: 50px !important;
      left: 0 !important;
      background: transparent !important;
      border: none !important;
      padding: 6px 0 !important;
      min-width: 180px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 4px !important;
    }

    .menu-link-item {
      display: none;
      color: #e0e0e0 !important;
      text-decoration: none !important;
      padding: 6px 8px !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      border-radius: 4px !important;
      align-items: center !important;
      gap: 8px !important;
      opacity: 0;
      transition: background 0.2s ease, color 0.2s ease, padding-left 0.2s ease !important;
    }
    .clean-social-menu.menu-open .menu-link-item {
      display: flex !important;
    }
    .clean-social-menu.menu-open .world-svg {
      transform: rotate(90deg) !important;
    }

    .typewriter-text {
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      max-width: 0;
    }
    .typewriter-text::after {
      content: '▋';
      display: inline-block;
      color: #ffffff;
      font-size: 10px;
      margin-left: 3px;
      opacity: 0;
    }

    /* Animaciones de cascada de redes */
    .clean-social-menu.menu-open .menu-link-item:nth-child(1) { animation: reveal-item 0.2s 0.05s forwards; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(1) .typewriter-text { animation: typing 0.45s linear forwards; animation-delay: 0.05s; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(1) .typewriter-text::after { animation: blink-caret 0.15s step-end infinite, hide-cursor 0s 0.50s forwards; animation-delay: 0.05s, 0.50s; }

    .clean-social-menu.menu-open .menu-link-item:nth-child(2) { animation: reveal-item 0.2s 0.50s forwards; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(2) .typewriter-text { animation: typing 0.45s linear forwards; animation-delay: 0.50s; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(2) .typewriter-text::after { animation: blink-caret 0.15s step-end infinite, hide-cursor 0s 0.95s forwards; animation-delay: 0.50s, 0.95s; }

    .clean-social-menu.menu-open .menu-link-item:nth-child(3) { animation: reveal-item 0.2s 0.95s forwards; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(3) .typewriter-text { animation: typing 0.45s linear forwards; animation-delay: 0.95s; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(3) .typewriter-text::after { animation: blink-caret 0.15s step-end infinite, hide-cursor 0s 1.40s forwards; animation-delay: 0.95s, 1.40s; }

    .clean-social-menu.menu-open .menu-link-item:nth-child(4) { animation: reveal-item 0.2s 1.40s forwards; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(4) .typewriter-text { animation: typing 0.45s linear forwards; animation-delay: 1.40s; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(4) .typewriter-text::after { animation: blink-caret 0.15s step-end infinite, hide-cursor 0s 1.85s forwards; animation-delay: 1.40s, 1.85s; }

    .clean-social-menu.menu-open .menu-link-item:nth-child(5) { animation: reveal-item 0.2s 1.85s forwards; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(5) .typewriter-text { animation: typing 0.45s linear forwards; animation-delay: 1.85s; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(5) .typewriter-text::after { animation: blink-caret 0.15s step-end infinite, hide-cursor 0s 2.30s forwards; animation-delay: 1.85s, 2.30s; }

    .clean-social-menu.menu-open .menu-link-item:nth-child(6) { animation: reveal-item 0.2s 2.30s forwards; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(6) .typewriter-text { animation: typing 0.45s linear forwards; animation-delay: 2.30s; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(6) .typewriter-text::after { animation: blink-caret 0.15s step-end infinite, hide-cursor 0s 2.75s forwards; animation-delay: 2.30s, 2.75s; }

    .clean-social-menu.menu-open .menu-link-item:nth-child(7) { animation: reveal-item 0.2s 2.75s forwards; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(7) .typewriter-text { animation: typing 0.45s linear forwards; animation-delay: 2.75s; }
    .clean-social-menu.menu-open .menu-link-item:nth-child(7) .typewriter-text::after { animation: blink-caret 0.4s step-end infinite; animation-delay: 2.75s; }

    .dot-indicator {
      width: 4px !important;
      height: 4px !important;
      background-color: #fae100 !important;
      border-radius: 50% !important;
      transition: all 0.2s ease !important;
      flex-shrink: 0 !important;
    }

    @media (hover: hover) {
      .menu-link-item:hover {
        background: rgba(255, 255, 255, 0.08) !important;
        color: #ffffff !important;
        padding-left: 14px !important;
      }
      .menu-link-item:hover .dot-indicator {
        background-color: #fae100 !important;
        box-shadow: 0 0 6px #fae100 !important;
      }
    }

    @media (max-width: 768px) {
      .mophra-global-btn { top: 12px !important; right: 12px !important; width: 54px !important; height: 54px !important; }
      .mophra-svg-element { width: 36px !important; height: 36px !important; }
      .mophra-sign-item { font-size: clamp(48px, 10vw, 58px) !important; }
      .mophra-sub-item { font-size: clamp(28px, 7vw, 34px) !important; }
      .mophra-signs-nav { padding-right: 15px !important; padding-top: 85px !important; }

      .clean-social-menu { top: 15px !important; left: 15px !important; }
      .menu-trigger-btn { width: 38px !important; height: 38px !important; }
      .world-svg { width: 16px !important; height: 16px !important; }
      .menu-dropdown-box { top: 45px !important; min-width: 150px !important; }
      .menu-link-item { font-size: 12px !important; padding: 8px 10px !important; }
    }
  </style>
</head>
<body>

  <!-- 🌍 MENÚ FLOTANTE DE REDES SOCIALES (IZQUIERDA) -->
  <div class="clean-social-menu" id="socialMenu">
    <button class="menu-trigger-btn" id="menuTrigger" aria-label="Redes Sociales">
      <svg class="world-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
    </button>

    <div class="menu-dropdown-box" id="menuDropdown">
      <!-- 1. Facebook -->
      <a href="https://www.facebook.com/mophrarecs" target="_blank" class="menu-link-item">
        <span class="dot-indicator"></span>
        <span class="typewriter-text" style="--ch: 8;">Facebook</span>
      </a>
      <!-- 2. Instagram -->
      <a href="https://www.instagram.com/mophrarecs" target="_blank" class="menu-link-item">
        <span class="dot-indicator"></span>
        <span class="typewriter-text" style="--ch: 9;">Instagram</span>
      </a>
      <!-- 3. SoundCloud -->
      <a href="https://soundcloud.com/mophrarecs" target="_blank" class="menu-link-item">
        <span class="dot-indicator"></span>
        <span class="typewriter-text" style="--ch: 10;">SoundCloud</span>
      </a>
      <!-- 4. Spotify -->
      <a href="https://open.spotify.com/user/31c5asr7apzu642jpd24ngjwtxjy" target="_blank" class="menu-link-item">
        <span class="dot-indicator"></span>
        <span class="typewriter-text" style="--ch: 7;">Spotify</span>
      </a>
      <!-- 5. TikTok -->
      <a href="https://www.tiktok.com/@mophrarecs" target="_blank" class="menu-link-item">
        <span class="dot-indicator"></span>
        <span class="typewriter-text" style="--ch: 6;">TikTok</span>
      </a>
      <!-- 6. Twitter / X -->
      <a href="https://x.com/mophrarecs" target="_blank" class="menu-link-item">
        <span class="dot-indicator"></span>
        <span class="typewriter-text" style="--ch: 11;">Twitter / X</span>
      </a>
      <!-- 7. Youtube -->
      <a href="https://www.youtube.com/@mophrarecs" target="_blank" class="menu-link-item">
        <span class="dot-indicator"></span>
        <span class="typewriter-text" style="--ch: 7;">Youtube</span>
      </a>
    </div>
  </div>

  <!-- 🧭 MENÚ PRINCIPAL MOPHRA (DERECHA) -->
  <div class="mophra-global-container" id="mophraGlobalMenu">
    <div class="mophra-global-overlay"></div>

  <!-- 🚀 SCRIPT INTEGRADO: VISOR 3D EXACTO + MENÚS MOPHRA -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <script>
    window.addEventListener('load', () => {
      // 1. Creamos el elemento model-viewer dinámicamente con tu código exacto
      const mv = document.createElement('model-viewer');

      mv.id = 'logo-3d-interactivo';
      mv.src = 'https://cdn.jsdelivr.net/gh/gatos64lcts/mophra/3DMOPHRA.glb?v=3';

      mv.setAttribute('camera-controls', '');
      mv.setAttribute('auto-rotate', '');
      mv.setAttribute('auto-rotate-delay', '0');
      mv.setAttribute('rotation-per-second', '6deg');
      mv.setAttribute('interaction-prompt', 'none');

      mv.setAttribute('disable-pan', '');
      mv.setAttribute('camera-target', '-0.1m 0m 0m');

      mv.setAttribute('camera-orbit', '0deg 75deg 10m');
      mv.setAttribute('field-of-view', 'auto');

      mv.setAttribute('shadow-intensity', '0.5');
      mv.setAttribute('exposure', '1.2');
      mv.setAttribute('environment-image', 'neutral');
      mv.setAttribute('tone-mapping', 'neutral');

      Object.assign(mv.style, {
        position: 'fixed',
        top: '0',
        left: '0',
        width: '100vw',
        height: '100vh',
        zIndex: '999',
        border: 'none',
        margin: '0',
        padding: '0',
        backgroundColor: 'transparent',
        transition: 'opacity 0.4s ease, visibility 0.4s ease, transform 0.1s ease',
        overflow: 'hidden',
        display: 'block',

        // === 🔥 EL TRUCO DEL ESCALADO CSS ===
        transform: 'scale(1.8)',
        transformOrigin: 'center center'
      });

      document.body.appendChild(mv);

      // 2. Control dinámico de los menús nativos MOPHRA (derecha e izquierda)
      const menuGlobal = document.getElementById('mophraGlobalMenu');
      const socialMenu = document.getElementById('socialMenu');

      if (menuGlobal && menuGlobal.parentElement !== document.body) {
        document.body.appendChild(menuGlobal);
      }
      if (socialMenu && socialMenu.parentElement !== document.body) {
        document.body.appendChild(socialMenu);
      }

      // 3. Permitir clics a través del wrapper de Carrd manteniendo interactivos sus elementos hijos
      const carrdWrapper = document.getElementById('wrapper') || document.querySelector('main') || document.getElementById('main');
      if (carrdWrapper) {
        carrdWrapper.style.setProperty('pointer-events', 'none', 'important');
        carrdWrapper.querySelectorAll('section, div, p, h1, h2, h3, a, button, form, span').forEach(el => {
          el.style.setProperty('pointer-events', 'auto', 'important');
        });
      }

      // 4. CONTROL TOTAL DE VISIBILIDAD Y CLICS SIMULTÁNEO SEGÚN EL HASH
      function verificarRuta() {
        const hash = window.location.hash;
        if (hash === '' || hash === '#' || hash === '#home') {
          mv.style.opacity = '1';
          mv.style.visibility = 'visible';
          if (socialMenu) {
            socialMenu.style.setProperty('opacity', '1', 'important');
            socialMenu.style.setProperty('visibility', 'visible', 'important');
            socialMenu.style.setProperty('pointer-events', 'auto', 'important');
            socialMenu.classList.add('section-active');
            socialMenu.querySelectorAll('a, button, .menu-link, .menu-item').forEach(el => {
              el.style.setProperty('pointer-events', 'auto', 'important');
            });
          }
        } else {
          mv.style.opacity = '0';
          mv.style.visibility = 'hidden';
          if (socialMenu) {
            socialMenu.style.setProperty('opacity', '0', 'important');
            socialMenu.style.setProperty('visibility', 'hidden', 'important');
            socialMenu.style.setProperty('pointer-events', 'none', 'important');
            socialMenu.classList.remove('section-active', 'menu-open');
            socialMenu.querySelectorAll('a, button, .menu-link, .menu-item').forEach(el => {
              el.style.setProperty('pointer-events', 'none', 'important');
            });
          }
        }
      }

      window.addEventListener('hashchange', verificarRuta);
      verificarRuta();

      // 5. 🌍 LÓGICA DEL MENÚ DE REDES SOCIALES (IZQUIERDA)
      const socialTrigger = document.getElementById('menuTrigger');
      if (socialTrigger && socialMenu) {
        socialTrigger.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          socialMenu.classList.toggle('menu-open');
        };

        // Cerrar menú de redes si se hace clic fuera de él
        document.addEventListener('click', (e) => {
          if (!socialMenu.contains(e.target)) {
            socialMenu.classList.remove('menu-open');
          }
        });
      }

      // 6. Lógica de animación del botón del menú derecho
      const PATH_LOGO = "M486.86,74.1l43.7.72c315.79,23.24,500.51,374.15,332.93,647.91-158.69,259.22-531.3,272.98-709.23,26.4C-45.68,472.05,147.58,85.24,486.86,74.1ZM901.07,465.81c-8.75-115.9-71.16-224.09-164.68-291.82-181.81-131.66-436.09-88.78-565.13,93.5-40.96,57.86-66.79,127.33-72.19,198.31h239.5l90,89.98,54.06-53.99-123.49-126.35,137.92-138.24,3.93-.93,140.01,139.17-123.49,126.35,53.92,52.94,89.14-88.93h240.5ZM499.7,267.88l-107.56,108.29,108.29,107.56,107.56-108.29-108.29-107.56ZM240.07,489.81H98.07c-2.86,10.5.77,21.33,0,32h110.5l31.5-32ZM297.07,489.81h-23.5l-31.5,32h23.5l31.5-32ZM757.07,521.81l-31.5-32h-23.5l32.5,32h22.5ZM902.07,489.81h-143l31.5,32h111.5c-.77-10.67,2.86-21.5,0-32ZM187.07,577.81h85.5l71.03-71.02c.78-1.08.51-1.86,0-2.96-.39-.84-12.26-12.79-13.17-12.95l-54.38,53.41-57.28.72c-2.03.6-27.76,26.59-30.21,29.79-.77,1.01-1.93,1.26-1.49,3.01ZM813.07,577.81l-32.7-32.8-56.28-.72-55.38-53.41c-.91.16-12.78,12.11-13.17,12.95-.51,1.1-.78,1.88,0,2.96l71.03,71.02h86.5ZM710.9,843.65l-.36-115.82-210.12-209.95-210.16,209.63.3,116.29c102.67,64.08,233.16,76.11,347.01,35.03,25.59-9.24,49.76-21.75,73.32-35.18ZM131.07,632.81h144.5l98.48-98.5-12.48-12.48-78.52,78.46-119.46.54-32.52,31.98ZM868.07,632.81l-32.52-31.98-119.46-.54-78.52-78.46c-2.2,3.31-12.84,10.05-11.03,13.96l97.03,97.02h144.5ZM185.07,544.81h-85l4.88,32.42,47.41.37,32.7-32.8ZM900.07,544.81h-86l32.7,32.8,48.41-.37,4.88-32.42ZM871.07,656.81h-156.5l-106-105.98-20.43,21.34,145.93,146.14v109.5c60.22-42.95,108.18-102.77,137-171ZM266.07,827.81v-109.5l145.98-146-21.48-20.54-106,105.04h-155.5c28.8,68.24,76.78,128.03,137,171ZM129.07,600.81h-19l4.01,15,14.99-15ZM890.07,600.81h-20l15.99,16,4.01-16Z";
      const PATH_X = "M500,50 C251.5,50 50,251.5 50,500 C50,748.5 251.5,950 500,950 C748.5,950 950,748.5 950,500 C950,251.5 748.5,50 500,50 Z M500,120 C709.9,120 880,290.1 880,500 C880,709.9 709.9,880 500,880 C290.1,880 120,709.9 120,500 C120,290.1 290.1,120 500,120 Z M330,260 L260,330 L430,500 L260,670 L330,740 L500,570 L670,740 L740,670 L570,500 L740,330 L670,260 L500,430 Z";

      const toggleBtn = document.getElementById('mophraVectorBtn');
      const vectorPath = document.getElementById('mophraVectorPath');
      const overlay = menuGlobal ? menuGlobal.querySelector('.mophra-global-overlay') : null;
      const navLinks = menuGlobal ? menuGlobal.querySelectorAll('.mophra-sign-link, a.mophra-sign-item, .mophra-sub-item') : [];
      const relToggle = document.getElementById('mophraReleasesToggle');
      const relWrap = relToggle ? relToggle.closest('.mophra-dropdown-wrapper') : null;

      if (toggleBtn && vectorPath && menuGlobal) {
        function abrirMenu() {
          menuGlobal.classList.add('menu-open');
          setTimeout(() => vectorPath.setAttribute('d', PATH_X), 200);
        }

        function cerrarMenu() {
          if (!menuGlobal.classList.contains('menu-open')) return;
          menuGlobal.classList.remove('menu-open');
          if (relWrap) relWrap.classList.remove('submenu-open');
          setTimeout(() => vectorPath.setAttribute('d', PATH_LOGO), 200);
        }

        if (relToggle && relWrap) {
          relToggle.onclick = (e) => {
            e.preventDefault(); e.stopPropagation();
            relWrap.classList.toggle('submenu-open');
          };
        }

        toggleBtn.onclick = (e) => {
          e.preventDefault(); e.stopPropagation();
          menuGlobal.classList.contains('menu-open') ? cerrarMenu() : abrirMenu();
        };

        if (overlay) overlay.onclick = (e) => { e.stopPropagation(); cerrarMenu(); };
        navLinks.forEach(l => l.onclick = () => cerrarMenu());

        let timer;
        function animarBoton() {
          cerrarMenu(); clearTimeout(timer);
          if (toggleBtn.classList.contains('animar-entrada')) {
            toggleBtn.classList.remove('animar-entrada');
            toggleBtn.classList.add('animar-salida');
            timer = setTimeout(() => {
              toggleBtn.classList.remove('animar-salida');
              void toggleBtn.offsetWidth;
              toggleBtn.classList.add('animar-entrada');
            }, 450);
          } else {
            timer = setTimeout(() => { void toggleBtn.offsetWidth; toggleBtn.classList.add('animar-entrada'); }, 400);
          }
        }

        window.addEventListener('hashchange', animarBoton);
        animarBoton();
      }
    });
  </script>
