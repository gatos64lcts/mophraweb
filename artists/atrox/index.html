<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOPHRA | Atrox</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">    
    <style>
        /* --- 📦 CARGA DE FUENTE PERSONALIZADA DESDE CLOUDINARY --- */
        @font-face {
            font-family: 'RelicusMono';
            src: url('https://res.cloudinary.com/dfhrxq0tf/raw/upload/v1784479120/Relicus-Mono_rsjgnn.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- Estilos Generales --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #F5260A;
            color: #ffffff;
            font-family: 'RelicusMono', monospace !important;
        }

        /* --- TU MENÚ GLOBAL ORIGINAL (CSS EXACTO) --- */
        .mophra-global-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99999;
            font-family: 'RelicusMono', monospace !important;
        }

        .mophra-global-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ff0000;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .mophra-global-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: transparent;
            border: none;
            cursor: pointer;
            pointer-events: auto;
            z-index: 100001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .mophra-svg-element {
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .mophra-signs-nav {
            position: absolute;
            top: 50%;
            right: 80px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100000;
        }

        .mophra-sign-item, .mophra-sign-link, .mophra-sub-item {
            font-family: 'RelicusMono', monospace !important;
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(24px, 4vw, 48px);
            font-weight: 900;
            letter-spacing: 2px;
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
        }

        .mophra-sign-item:hover, .mophra-sign-link:hover, .mophra-sub-item:hover {
            opacity: 0.7;
        }

        .mophra-dropdown-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .mophra-sign-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mophra-submenu-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .mophra-frolov-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
        }

        .mophra-frolov-icon span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            transition: transform 0.3s ease;
        }

        .mophra-submenu {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            margin-right: 10px;
        }

        .mophra-sub-item {
            font-size: clamp(16px, 2.5vw, 24px);
            opacity: 0.8;
        }

        /* Estados activos del menú al abrirse */
        .mophra-global-container.active {
            pointer-events: auto;
        }

        .mophra-global-container.active .mophra-global-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .mophra-global-container.active .mophra-signs-nav {
            pointer-events: auto;
            opacity: 1;
        }

        .mophra-global-container.active .mophra-global-btn {
            position: fixed;
        }

        .mophra-global-container.active .mophra-submenu.open {
            max-height: 200px;
            margin-top: 10px;
            margin-bottom: 10px;
        }


        /* --- 🎨 ESTILOS DE LA SECCIÓN DE ARTISTA --- */
        .artist-page {
            font-family: 'RelicusMono', monospace !important;
        }

        .artist-banner {
            position: relative;
            width: 100%;
            height: 750px;
            padding: 0 40px 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            box-sizing: border-box;
            background-size: cover;
            background-position: center 60%;
            background-repeat: no-repeat;
            animation: slideFromTop 1.4s cubic-bezier(.22,1,.36,1) forwards;
        }

        .artist-name {
            font-family: 'RelicusMono', monospace !important;
            font-weight: 900 !important;
            font-size: clamp(48px, 12vw, 130px);
            margin: 0;
            text-shadow: 0 10px 30px rgba(0,0,0,.8);
            color: #fff;
            line-height: 1.05;
            letter-spacing: -2px;
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
        }

        .artist-meta {
            font-family: 'RelicusMono', monospace !important;
            font-size: 19px;
            letter-spacing: 0.5px;
            margin-top: 14px;
            color: #ffffff;
            font-weight: 700;
            text-align: left;
            text-transform: none;
        }

        /* --- Indicador de Scroll (Escritorio) --- */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-family: 'RelicusMono', monospace !important;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .scroll-arrow {
            display: inline-block;
            animation: bounce 2s infinite;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 60px 80px;
            gap: 40px;
            align-items: start;
            opacity: 0;
            animation: fadeUp 1s ease-out .8s forwards;
        }

        .bio-title {
            margin-bottom: 20px;
            color: #fff;
            font-family: 'RelicusMono', monospace !important;
            text-align: center;
        }
        
        .bio-title::after { 
            content: ''; 
            display: block; 
            width: 40px; 
            height: 3px; 
            background: #fff; 
            margin: 8px auto 0; 
        }
        
        .left-column { text-align: center; }

        .bio-text {
            line-height: 1.6;
            color: rgba(255,255,255,0.85);
            font-size: 17px;
            max-width: 450px;
            margin: 0 auto 18px auto;
            text-align: left;
            font-family: 'RelicusMono', monospace !important;
        }

        .artist-links { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            justify-content: center; 
            margin-top: 25px; 
        }

        .glass-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.1);
            transition: all 0.3s ease;
            font-family: 'RelicusMono', monospace !important;
            font-weight: 500;
            font-size: 15px;
        }
        
        .glass-btn:hover { 
            background: rgba(255,255,255,0.2); 
            transform: translateY(-3px); 
            border-color: rgba(255,255,255,0.4); 
        }
        
        .spotify-box iframe { 
            width: 100%; 
            border: none; 
            border-radius: 15px; 
        }

        /* --- 🎶 ESTILOS DE LA SECCIÓN DE RELEASES --- */
        .releases-section {
            font-family: 'RelicusMono', monospace !important;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: left !important;
            opacity: 0;
            animation: fadeUpReleases 1s ease-out forwards;
        }

        .releases-title {
            font-family: 'RelicusMono', monospace !important;
            font-weight: 900 !important;
            font-size: clamp(32px, 6vw, 64px);
            color: #ffffff;
            margin: 0 0 30px 0;
            letter-spacing: -1px;
            text-transform: none !important;
            text-align: left !important;
        }

        .releases-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: #ffffff;
            margin: 12px 0 0 0;
        }

        .releases-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-top: 30px;
        }

        .release-card {
            position: relative;
            display: block;
            text-decoration: none;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: none !important;
            transition: border-color 0.3s ease, box-shadow 0.3s ease !important;
        }

        .release-cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%;
            overflow: hidden;
        }

        .release-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none !important;
            transition: none !important;
            scale: 1 !important;
        }

        .release-card:hover .release-cover,
        .release-cover:hover,
        a:hover .release-cover {
            transform: none !important;
            scale: 1 !important;
        }

        .release-info {
            padding: 16px 12px;
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .release-name {
            font-family: 'RelicusMono', monospace !important;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Animaciones --- */
        @keyframes slideFromTop { 
            0% { opacity: 0; transform: translateY(-120px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes fadeUp { 
            0% { opacity: 0; transform: translateY(40px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }

        @keyframes fadeUpReleases {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            60% { transform: translateY(-3px); }
        }

        /* --- Ajustes Responsivos --- */
        @media(max-width: 1000px) {
            .artist-banner {
                height: 480px;
                padding: 0 20px 20px 20px;
            }
            .artist-name {
                letter-spacing: -1.5px;
            }
            .artist-meta {
                font-size: 16px;
                margin-top: 10px;
            }
            .scroll-indicator { display: none !important; }
            .main-content { grid-template-columns: 1fr; padding: 30px 20px; }
        }

        @media (max-width: 900px) {
            .releases-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }

        @media (max-width: 500px) {
            .releases-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .release-name { font-size: 14px; }
            .release-info { padding: 10px 8px; }
        }
    </style>
</head>

    <style>
        .mophra-global-container {
            position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
            width: 100% !important; height: 100vh !important;
            background-color: transparent !important;
            overflow: hidden !important;
            overflow-x: hidden !important;
            font-family: 'RelicusMono', monospace !important; user-select: none !important; z-index: 999999 !important; pointer-events: none !important;
        }

        @keyframes entradaBoton { 0% { transform: translateY(-100px); opacity: 0; } 70% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes salidaBoton { 0% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }

        .mophra-global-btn {
            position: fixed !important; top: 30px !important; right: 30px !important; z-index: 1000000 !important;
            background: rgba(255, 255, 255, 0.1) !important; border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 50% !important; width: 70px !important; height: 70px !important; cursor: pointer !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            backdrop-filter: blur(5px) !important; pointer-events: auto !important; padding: 0 !important; opacity: 0 !important;
            transition: background 0.3s, transform 0.3s !important;
        }

        .mophra-global-btn.animar-entrada { opacity: 1 !important; animation: entradaBoton 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
        .mophra-global-btn.animar-salida { opacity: 1 !important; animation: salidaBoton 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
        .mophra-global-btn:hover { background: rgba(255, 255, 255, 0.25) !important; transform: scale(1.05) !important; }

        .mophra-svg-element { width: 62px !important; height: 62px !important; display: block !important; transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none; }
        #mophraVectorPath { transition: opacity 0.2s ease, d 0.2s ease; }
        .mophra-global-container.menu-open .mophra-svg-element { transform: rotate(180deg); }
        .mophra-global-container.menu-open { pointer-events: auto !important; }

        .mophra-global-overlay {
            position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important;
            background-color: #000000 !important;
            transform: translateX(100%) !important;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1) !important;
            pointer-events: none !important;
        }
        .mophra-global-container.menu-open .mophra-global-overlay { transform: translateX(0) !important; pointer-events: auto !important; }

        .mophra-signs-nav {
            position: absolute !important; right: 0 !important; top: 0 !important; height: 100% !important; max-height: 100vh !important;
            display: flex !important; flex-direction: column !important; align-items: flex-end !important;
            padding-right: 40px !important; padding-top: 130px !important; padding-bottom: 30px !important; box-sizing: border-box !important;
            z-index: 100000 !important; pointer-events: none !important;
            overflow-y: auto !important; overflow-x: hidden !important;
        }
        .mophra-global-container.menu-open .mophra-signs-nav { pointer-events: auto !important; }

        .mophra-sign-item {
            display: block !important; color: #ffffff !important; text-decoration: none !important; text-transform: uppercase !important;
            font-weight: 900 !important; font-size: clamp(40px, 5.5vw, 80px) !important; line-height: 0.92 !important; letter-spacing: -2px !important;
            transform: translateX(100vw) !important; transform-origin: right center !important; width: max-content !important;
            pointer-events: none !important; visibility: hidden !important;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1), color 0.1s ease 0s, visibility 0s linear 0.4s !important;
        }
        .mophra-global-container.menu-open .mophra-sign-item { transform: translateX(0) !important; pointer-events: auto !important; visibility: visible !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(1) { transition-delay: 0.15s, 0s, 0.15s !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(2) { transition-delay: 0.22s, 0s, 0.22s !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(3) { transition-delay: 0.29s, 0s, 0.29s !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(4) { transition-delay: 0.36s, 0s, 0.36s !important; }
        .mophra-global-container.menu-open .mophra-sign-item:nth-child(5) { transition-delay: 0.43s, 0s, 0.43s !important; }

        a.mophra-sign-item:hover, .mophra-sign-link:hover { color: #969696 !important; }

        .mophra-dropdown-wrapper { display: flex !important; flex-direction: column !important; align-items: flex-end !important; }
        .mophra-sign-header { display: flex !important; align-items: center !important; justify-content: flex-end !important; gap: 18px !important; width: 100% !important; }
        .mophra-sign-link { color: inherit !important; text-decoration: none !important; }
        .mophra-submenu-toggle { background: none !important; border: none !important; cursor: pointer !important; padding: 0 !important; display: flex !important; align-items: center !important; }

        .mophra-frolov-icon {
            width: clamp(28px, 3.8vw, 44px) !important; height: clamp(20px, 3vw, 30px) !important;
            display: flex !important; flex-direction: column !important; justify-content: space-between !important; position: relative !important;
        }
        .mophra-frolov-icon span {
            display: block !important; height: clamp(3px, 0.4vw, 5px) !important; background-color: #ffffff !important; border-radius: 10px !important;
            transition: transform 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.25s ease, width 0.3s ease, margin 0.3s ease !important;
            transform-origin: center !important;
        }
        .mophra-frolov-icon .line-top { width: 40% !important; margin-right: auto !important; margin-left: 0 !important; }
        .mophra-frolov-icon .line-mid { width: 100% !important; margin-left: auto !important; }
        .mophra-frolov-icon .line-bot { width: 60% !important; margin-left: auto !important; }

        .mophra-dropdown-wrapper.submenu-open .mophra-frolov-icon .line-top {
            width: 100% !important; margin-left: 0 !important;
