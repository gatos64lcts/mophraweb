<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOPHRA | Atrox</title>
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="https://i.ibb.co/tTVxkjnP/bnnr-atrox.webp">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 📦 CARGA DE FUENTE PERSONALIZADA DESDE CLOUDINARY --- */
        @font-face {
            font-family: 'RelicusMono';
            src: url('https://res.cloudinary.com/dfhrxq0tf/raw/upload/v1784479120/Relicus-Mono_rsjgnn.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- Estilos Generales --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'RelicusMono', monospace !important;
        }

        /* --- TU MENÚ GLOBAL ORIGINAL (CSS EXACTO) --- */
        .mophra-global-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99999;
            font-family: 'RelicusMono', monospace !important;
        }

        .mophra-global-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ff0000;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .mophra-global-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: transparent;
            border: none;
            cursor: pointer;
            pointer-events: auto;
            z-index: 100001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .mophra-svg-element {
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .mophra-signs-nav {
            position: absolute;
            top: 50%;
            right: 80px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100000;
        }

        .mophra-sign-item, .mophra-sign-link, .mophra-sub-item {
            font-family: 'RelicusMono', monospace !important;
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(24px, 4vw, 48px);
            font-weight: 900;
            letter-spacing: 2px;
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
        }

        .mophra-sign-item:hover, .mophra-sign-link:hover, .mophra-sub-item:hover {
            opacity: 0.7;
        }

        .mophra-dropdown-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .mophra-sign-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mophra-submenu-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .mophra-frolov-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
        }

        .mophra-frolov-icon span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            transition: transform 0.3s ease;
        }

        .mophra-submenu {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            margin-right: 10px;
        }

        .mophra-sub-item {
            font-size: clamp(16px, 2.5vw, 24px);
            opacity: 0.8;
        }

        /* Estados activos del menú al abrirse */
        .mophra-global-container.active {
            pointer-events: auto;
        }

        .mophra-global-container.active .mophra-global-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .mophra-global-container.active .mophra-signs-nav {
            pointer-events: auto;
            opacity: 1;
        }

        .mophra-global-container.active .mophra-global-btn {
            position: fixed;
        }

        .mophra-global-container.active .mophra-submenu.open {
            max-height: 200px;
            margin-top: 10px;
            margin-bottom: 10px;
        }


        /* --- 🎨 ESTILOS DE LA SECCIÓN DE ARTISTA --- */
        .artist-page {
            font-family: 'RelicusMono', monospace !important;
        }

        .artist-banner {
            position: relative;
            width: 100%;
            height: 750px;
            padding: 0 40px 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            box-sizing: border-box;
            background-size: cover;
            background-position: center 60%;
            background-repeat: no-repeat;
            animation: slideFromTop 1.4s cubic-bezier(.22,1,.36,1) forwards;
        }

        .artist-name {
            font-family: 'RelicusMono', monospace !important;
            font-weight: 900 !important;
            font-size: clamp(48px, 12vw, 130px);
            margin: 0;
            text-shadow: 0 10px 30px rgba(0,0,0,.8);
            color: #fff;
            line-height: 1.05;
            letter-spacing: -2px;
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
        }

        .artist-meta {
            font-family: 'RelicusMono', monospace !important;
            font-size: 19px;
            letter-spacing: 0.5px;
            margin-top: 14px;
            color: #ffffff;
            font-weight: 700;
            text-align: left;
            text-transform: none;
        }

        /* --- Indicador de Scroll (Escritorio) --- */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-family: 'RelicusMono', monospace !important;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .scroll-arrow {
            display: inline-block;
            animation: bounce 2s infinite;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 60px 80px;
            gap: 40px;
            align-items: start;
            opacity: 0;
            animation: fadeUp 1s ease-out .8s forwards;
        }

        .bio-title {
            margin-bottom: 20px;
            color: #fff;
            font-family: 'RelicusMono', monospace !important;
            text-align: center;
        }
        
        .bio-title::after { 
            content: ''; 
            display: block; 
            width: 40px; 
            height: 3px; 
            background: #fff; 
            margin: 8px auto 0; 
        }
        
        .left-column { text-align: center; }

        .bio-text {
            line-height: 1.6;
            color: rgba(255,255,255,0.85);
            font-size: 17px;
            max-width: 450px;
            margin: 0 auto 18px auto;
            text-align: left;
            font-family: 'RelicusMono', monospace !important;
        }

        .artist-links { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            justify-content: center; 
            margin-top: 25px; 
        }

        .glass-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.1);
            transition: all 0.3s ease;
            font-family: 'RelicusMono', monospace !important;
            font-weight: 500;
            font-size: 15px;
        }
        
        .glass-btn:hover { 
            background: rgba(255,255,255,0.2); 
            transform: translateY(-3px); 
            border-color: rgba(255,255,255,0.4); 
        }
        
        .spotify-box iframe { 
            width: 100%; 
            border: none; 
            border-radius: 15px; 
        }

        /* --- 🎶 ESTILOS DE LA SECCIÓN DE RELEASES --- */
        .releases-section {
            font-family: 'RelicusMono', monospace !important;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: left !important;
            opacity: 0;
            animation: fadeUpReleases 1s ease-out forwards;
        }

        .releases-title {
            font-family: 'RelicusMono', monospace !important;
            font-weight: 900 !important;
            font-size: clamp(32px, 6vw, 64px);
            color: #ffffff;
            margin: 0 0 30px 0;
            letter-spacing: -1px;
            text-transform: none !important;
            text-align: left !important;
        }

        .releases-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: #ffffff;
            margin: 12px 0 0 0;
        }

        .releases-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-top: 30px;
        }

        .release-card {
            position: relative;
            display: block;
            text-decoration: none;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: none !important;
            transition: border-color 0.3s ease, box-shadow 0.3s ease !important;
        }

        .release-cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%;
            overflow: hidden;
        }

        .release-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none !important;
            transition: none !important;
            scale: 1 !important;
        }

        .release-card:hover .release-cover,
        .release-cover:hover,
        a:hover .release-cover {
            transform: none !important;
            scale: 1 !important;
        }

        .release-info {
            padding: 16px 12px;
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .release-name {
            font-family: 'RelicusMono', monospace !important;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Animaciones --- */
        @keyframes slideFromTop { 
            0% { opacity: 0; transform: translateY(-120px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes fadeUp { 
            0% { opacity: 0; transform: translateY(40px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }

        @keyframes fadeUpReleases {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            60% { transform: translateY(-3px); }
        }

        /* --- Ajustes Responsivos --- */
        @media(max-width: 1000px) {
            .artist-banner {
                height: 480px;
                padding: 0 20px 20px 20px;
            }
            .artist-name {
                letter-spacing: -1.5px;
            }
            .artist-meta {
                font-size: 16px;
                margin-top: 10px;
            }
            .scroll-indicator { display: none !important; }
            .main-content { grid-template-columns: 1fr; padding: 30px 20px; }
        }

        @media (max-width: 900px) {
            .releases-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }

        @media (max-width: 500px) {
            .releases-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .release-name { font-size: 14px; }
            .release-info { padding: 10px 8px; }
        }
    </style>
</head>
<body>

    <!-- TU MENÚ GLOBAL EXACTO CON SU HTML ORIGINAL -->
    <div class="mophra-global-container" id="mophraGlobalMenu">
        <div class="mophra-global-overlay"></div>

        <button class="mophra-global-btn" id="mophraVectorBtn" title="Ver menú">
            <svg id="mophraSvgLogo" viewBox="0 0 1000 1000" class="mophra-svg-element">
                <path id="mophraVectorPath" fill="#ffffff" d="M486.86,74.1l43.7.72c315.79,23.24,500.51,374.15,332.93,647.91-158.69,259.22-531.3,272.98-709.23,26.4C-45.68,472.05,147.58,85.24,486.86,74.1ZM901.07,465.81c-8.75-115.9-71.16-224.09-164.68-291.82-181.81-131.66-436.09-88.78-565.13,93.5-40.96,57.86-66.79,127.33-72.19,198.31h239.5l90,89.98,54.06-53.99-123.49-126.35,137.92-138.24,3.93-.93,140.01,139.17-123.49,126.35,53.92,52.94,89.14-88.93h240.5ZM499.7,267.88l-107.56,108.29,108.29,107.56,107.56-108.29-108.29-107.56ZM240.07,489.81H98.07c-2.86,10.5.77,21.33,0,32h110.5l31.5-32ZM297.07,489.81h-23.5l-31.5,32h23.5l31.5-32ZM757.07,521.81l-31.5-32h-23.5l32.5,32h22.5ZM902.07,489.81h-143l31.5,32h111.5c-.77-10.67,2.86-21.5,0-32ZM187.07,577.81h85.5l71.03-71.02c.78-1.08.51-1.86,0-2.96-.39-.84-12.26-12.79-13.17-12.95l-54.38,53.41-57.28.72c-2.03.6-27.76,26.59-30.21,29.79-.77,1.01-1.93,1.26-1.49,3.01ZM813.07,577.81l-32.7-32.8-56.28-.72-55.38-53.41c-.91.16-12.78,12.11-13.17,12.95-.51,1.1-.78,1.88,0,2.96l71.03,71.02h86.5ZM710.9,843.65l-.36-115.82-210.12-209.95-210.16,209.63.3,116.29c102.67,64.08,233.16,76.11,347.01,35.03,25.59-9.24,49.76-21.75,73.32-35.18ZM131.07,632.81h144.5l98.48-98.5-12.48-12.48-78.52,78.46-119.46.54-32.52,31.98ZM868.07,632.81l-32.52-31.98-119.46-.54-78.52-78.46c-2.2,3.31-12.84,10.05-11.03,13.96l97.03,97.02h144.5ZM185.07,544.81h-85l4.88,32.42,47.41.37,32.7-32.8ZM900.07,544.81h-86l32.7,32.8,48.41-.37,4.88-32.42ZM871.07,656.81h-156.5l-106-105.98-20.43,21.34,145.93,146.14v109.5c60.22-42.95,108.18-102.77,137-171ZM266.07,827.81v-109.5l145.98-146-21.48-20.54-106,105.04h-155.5c28.8,68.24,76.78,128.03,137,171ZM129.07,600.81h-19l4.01,15,14.99-15ZM890.07,600.81h-20l15.99,16,4.01-16Z"/>
            </svg>
        </button>
        <nav class="mophra-signs-nav">
            <a href="https://mophrarecs.com" class="mophra-sign-item">HOME</a>
            <a href="#artists" class="mophra-sign-item">ARTISTS</a>

            <div class="mophra-sign-item mophra-dropdown-wrapper">
                <div class="mophra-sign-header">
                    <button type="button" class="mophra-submenu-toggle" id="mophraReleasesToggle" aria-label="Toggle Releases Submenu">
                        <span class="mophra-frolov-icon">
                            <span class="line-top"></span>
                            <span class="line-mid"></span>
                            <span class="line-bot"></span>
                        </span>
                    </button>
                    <a href="#releases" class="mophra-sign-link">RELEASES</a>
                </div>
                <div class="mophra-submenu" id="mophraReleasesSubmenu">
                    <a href="#eps" class="mophra-sub-item">EPs</a>
                    <a href="#albums" class="mophra-sub-item">Albums</a>
                    <a href="#compilations" class="mophra-sub-item">Compilations</a>
                </div>
            </div>

            <a href="#demos" class="mophra-sign-item">DEMOS</a>
            <a href="#radio" class="mophra-sign-item">RADIO</a>
        </nav>
    </div>

    <!-- SECCIÓN DE ARTISTA -->
    <div class="artist-page">
        <header class="artist-banner" style="background-image: url('https://i.ibb.co/tTVxkjnP/bnnr-atrox.webp');">
            <h1 class="artist-name">Atrox</h1>
            <div class="artist-meta">This artist has 1 Single</div>
            <div class="scroll-indicator">SCROLL <span class="scroll-arrow">🡻</span></div>
        </header>

        <main class="main-content">
            <div class="left-column">
                <h2 class="bio-title">About</h2>
                <p class="bio-text">
                    . . .
                </p>
                <div class="artist-links">
                    <a href="https://www.instagram.com/rzdarwin.vst" target="_blank" rel="noopener noreferrer" class="glass-btn"><i class="fa-brands fa-instagram"></i> Instagram</a>
                    <a href="https://soundcloud.com/mophrarecs/atrox-flow" target="_blank" rel="noopener noreferrer" class="glass-btn"><i class="fa-brands fa-soundcloud"></i> SoundCloud</a>
                    <a href="https://music.apple.com/us/album/flow/1835126618?i=1835126619" target="_blank" rel="noopener noreferrer" class="glass-btn"><i class="fa-brands fa-apple"></i> Apple Music</a>
                </div>
            </div>
            <div class="right-column">
                <div class="spotify-box">
                    <iframe src="https://open.spotify.com/embed/artist/2OZ6kwJ8ogeqHsXWylMpLc?utm_source=generator&si=ea785353c0ef42e9" width="100%" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </div>
        </main>
    </div>

    <!-- SECCIÓN DE RELEASES -->
    <div class="releases-section">
        <h2 class="releases-title">Releases</h2>

        <div class="releases-grid">
            <a href="https://open.spotify.com/intl-es/track/434SUwwntOmc22xNstBZnx?si=0c88e56922fa46be" target="_blank" rel="noopener noreferrer" class="release-card">
                <div class="release-cover-wrapper">
                    <img src="https://i.ibb.co/BVv6pL5z/005-flow.webp" alt="Release Cover 1" class="release-cover" />
                </div>
                <div class="release-info">
                    <h3 class="release-name">Flow</h3>
                </div>
            </a>
        </div>
    </div>

    <!-- SCRIPT PARA QUE EL MENÚ FUNCIONE CORRECTAMENTE AL HACER CLIC -->
    <script>
        const menuContainer = document.getElementById('mophraGlobalMenu');
        const vectorBtn = document.getElementById('mophraVectorBtn');
        const releasesToggle = document.getElementById('mophraReleasesToggle');
        const releasesSubmenu = document.getElementById('mophraReleasesSubmenu');
        const svgLogo = document.getElementById('mophraSvgLogo');

        // Cambiar icono de hamburguesa a la X o viceversa mediante clases/clicks si usas JS para abrir
        vectorBtn.addEventListener('click', () => {
            menuContainer.classList.toggle('active');
            if(menuContainer.classList.contains('active')) {
                svgLogo.style.transform = 'rotate(45deg)';
            } else {
                svgLogo.style.transform = 'rotate(0deg)';
                releasesSubmenu.classList.remove('open');
            }
        });

        // Desplegar submenú de releases
        if(releasesToggle) {
            releasesToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                releasesSubmenu.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
