<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOPHRA | Atrox</title>
    <link rel="icon" type="image/webp" href="https://i.ibb.co/tTVxkjnP/bnnr-atrox.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 📦 CARGA DE FUENTE PERSONALIZADA DESDE CLOUDINARY --- */
        @font-face {
            font-family: 'RelicusMono';
            src: url('https://res.cloudinary.com/dfhrxq0tf/raw/upload/v1784479120/Relicus-Mono_rsjgnn.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- Estilos Generales --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'RelicusMono', monospace !important;
        }

        /* --- MENÚ GLOBAL (Estándar Mophra) --- */
        .global-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            background: rgba(11, 11, 11, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-logo {
            font-family: 'RelicusMono', monospace !important;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            font-family: 'RelicusMono', monospace !important;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
        }

        /* Espaciado para que el menú fijo no tape el contenido */
        .page-wrapper {
            padding-top: 70px;
        }

        /* --- 🎨 ESTILOS DE LA SECCIÓN DE ARTISTA --- */
        .artist-page {
            font-family: 'RelicusMono', monospace !important;
        }

        .artist-banner {
            position: relative;
            width: 100%;
            height: 750px;
            padding: 0 40px 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            box-sizing: border-box;
            background-size: cover;
            background-position: center 60%;
            background-repeat: no-repeat;
            animation: slideFromTop 1.4s cubic-bezier(.22,1,.36,1) forwards;
        }

        .artist-name {
            font-family: 'RelicusMono', monospace !important;
            font-weight: 900 !important;
            font-size: clamp(48px, 12vw, 130px);
            margin: 0;
            text-shadow: 0 10px 30px rgba(0,0,0,.8);
            color: #fff;
            line-height: 1.05;
            letter-spacing: -2px;
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
        }

        .artist-meta {
            font-family: 'RelicusMono', monospace !important;
            font-size: 19px;
            letter-spacing: 0.5px;
            margin-top: 14px;
            color: #ffffff;
            font-weight: 700;
            text-align: left;
            text-transform: none;
        }

        /* --- Indicador de Scroll (Escritorio) --- */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-family: 'RelicusMono', monospace !important;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .scroll-arrow {
            display: inline-block;
            animation: bounce 2s infinite;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 60px 80px;
            gap: 40px;
            align-items: start;
            opacity: 0;
            animation: fadeUp 1s ease-out .8s forwards;
        }

        .bio-title {
            margin-bottom: 20px;
            color: #fff;
            font-family: 'RelicusMono', monospace !important;
            text-align: center;
        }
        
        .bio-title::after { 
            content: ''; 
            display: block; 
            width: 40px; 
            height: 3px; 
            background: #fff; 
            margin: 8px auto 0; 
        }
        
        .left-column { text-align: center; }

        .bio-text {
            line-height: 1.6;
            color: rgba(255,255,255,0.85);
            font-size: 17px;
            max-width: 450px;
            margin: 0 auto 18px auto;
            text-align: left;
            font-family: 'RelicusMono', monospace !important;
        }

        .artist-links { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            justify-content: center; 
            margin-top: 25px; 
        }

        .glass-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.1);
            transition: all 0.3s ease;
            font-family: 'RelicusMono', monospace !important;
            font-weight: 500;
            font-size: 15px;
        }
        
        .glass-btn:hover { 
            background: rgba(255,255,255,0.2); 
            transform: translateY(-3px); 
            border-color: rgba(255,255,255,0.4); 
        }
        
        .spotify-box iframe { 
            width: 100%; 
            border: none; 
            border-radius: 15px; 
        }

        /* --- 🎶 ESTILOS DE LA SECCIÓN DE RELEASES --- */
        .releases-section {
            font-family: 'RelicusMono', monospace !important;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: left !important;
            opacity: 0;
            animation: fadeUpReleases 1s ease-out forwards;
        }

        .releases-title {
            font-family: 'RelicusMono', monospace !important;
            font-weight: 900 !important;
            font-size: clamp(32px, 6vw, 64px);
            color: #ffffff;
            margin: 0 0 30px 0;
            letter-spacing: -1px;
            text-transform: none !important;
            text-align: left !important;
        }

        .releases-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: #ffffff;
            margin: 12px 0 0 0;
        }

        .releases-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-top: 30px;
        }

        .release-card {
            position: relative;
            display: block;
            text-decoration: none;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: none !important;
            transition: border-color 0.3s ease, box-shadow 0.3s ease !important;
        }

        .release-cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%;
            overflow: hidden;
        }

        .release-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none !important;
            transition: none !important;
            scale: 1 !important;
        }

        .release-card:hover .release-cover,
        .release-cover:hover,
        a:hover .release-cover {
            transform: none !important;
            scale: 1 !important;
        }

        .release-info {
            padding: 16px 12px;
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .release-name {
            font-family: 'RelicusMono', monospace !important;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Animaciones --- */
        @keyframes slideFromTop { 
            0% { opacity: 0; transform: translateY(-120px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes fadeUp { 
            0% { opacity: 0; transform: translateY(40px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }

        @keyframes fadeUpReleases {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            60% { transform: translateY(-3px); }
        }

        /* --- Ajustes Responsivos --- */
        @media(max-width: 1000px) {
            .artist-banner {
                height: 480px;
                padding: 0 20px 20px 20px;
            }
            .artist-name {
                letter-spacing: -1.5px;
            }
            .artist-meta {
                font-size: 16px;
                margin-top: 10px;
            }
            .scroll-indicator { display: none !important; }
            .main-content { grid-template-columns: 1fr; padding: 30px 20px; }
            .global-nav { padding: 0 20px; }
        }

        @media (max-width: 900px) {
            .releases-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }

        @media (max-width: 500px) {
            .releases-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .release-name { font-size: 14px; }
            .release-info { padding: 10px 8px; }
        }
    </style>
</head>
<body>

    <nav class="global-nav">
        <a href="/" class="nav-logo">MOPHRA</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/artists" class="active">Artists</a></li>
            <li><a href="/releases">Releases</a></li>
        </ul>
    </nav>

    <div class="page-wrapper">
        <div class="artist-page">
            <header class="artist-banner" style="background-image: url('https://i.ibb.co/tTVxkjnP/bnnr-atrox.webp');">
                <h1 class="artist-name">Atrox</h1>
                <div class="artist-meta">This artist has 1 Single</div>
                <div class="scroll-indicator">SCROLL <span class="scroll-arrow">🡻</span></div>
            </header>

            <main class="main-content">
                <div class="left-column">
                    <h2 class="bio-title">About</h2>
                    <p class="bio-text">
                        . . .
                    </p>
                    <div class="artist-links">
                        <a href="https://www.instagram.com/rzdarwin.vst" target="_blank" rel="noopener noreferrer" class="glass-btn"><i class="fa-brands fa-instagram"></i> Instagram</a>
                        <a href="https://soundcloud.com/mophrarecs/atrox-flow" target="_blank" rel="noopener noreferrer" class="glass-btn"><i class="fa-brands fa-soundcloud"></i> SoundCloud</a>
                        <a href="https://music.apple.com/us/album/flow/1835126618?i=1835126619" target="_blank" rel="noopener noreferrer" class="glass-btn"><i class="fa-brands fa-apple"></i> Apple Music</a>
                    </div>
                </div>
                <div class="right-column">
                    <div class="spotify-box">
                        <iframe src="https://open.spotify.com/embed/track/0" width="100%" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                    </div>
                </div>
            </main>
        </div>

        <div class="releases-section">
            <h2 class="releases-title">Releases</h2>

            <div class="releases-grid">
                <a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" class="release-card">
                    <div class="release-cover-wrapper">
                        <img src="https://i.ibb.co/BVv6pL5z/005-flow.webp" alt="Release Cover 1" class="release-cover" />
                    </div>
                    <div class="release-info">
                        <h3 class="release-name">Flow</h3>
                    </div>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
