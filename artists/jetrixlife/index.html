.artist-meta {

font-size: 19px;
letter-spacing: 0.5px;
margin-top: 14px;
color: #ffffff;
font-weight: 700;
text-align: left;
text-transform: none;
}

/* --- Indicador de Scroll (Escritorio) --- */
.scroll-indicator {
position: absolute;
bottom: 30px;
right: 40px;
font-family: 'RelicusMono', monospace !important;
font-size: 15px;
font-weight: 700;
color: #ffffff;
letter-spacing: 2px;
text-transform: uppercase;

align-items: center;

}

.scroll-arrow {
display: inline-block;
animation: bounce 2s infinite;
}

.main-content {
display: grid;
grid-template-columns: 1fr 1fr;
padding: 60px 80px;
gap: 40px;
align-items: start;
opacity: 0;
animation: fadeUp 1s ease-out .8s forwards;
}

.bio-title {
margin-bottom: 20px;
color: #fff;
font-family: 'RelicusMono', monospace !important;
}
.bio-title::after { content: ''; display: block; width: 40px; height: 3px; background: #fff; margin: 8px auto 0; }
.left-column { text-align: center; }

.bio-text {
line-height: 1.6;
color: rgba(255,255,255,0.85);
font-size: 17px;
max-width: 450px;
margin: 0 auto 18px auto;
text-align: left;
font-family: 'RelicusMono', monospace !important;
}

.artist-links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 25px; }

.glass-btn {
display: inline-flex;
align-items: center;
gap: 8px;
padding: 12px 24px;
border-radius: 50px;
color: #fff;
text-decoration: none;
background: rgba(255,255,255,.05);
backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,.1);
transition: all 0.3s ease;
font-family: 'RelicusMono', monospace !important;
font-weight: 500;
font-size: 15px;
}
.glass-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-3px); border-color: rgba(255,255,255,0.4); }
.spotify-box iframe { width: 100%; border: none; border-radius: 15px; }

@keyframes slideFromTop { 0% { opacity: 0; transform: translateY(-120px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes fadeUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }

@keyframes bounce {
0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
40% { transform: translateY(-6px); }
60% { transform: translateY(-3px); }
}

/* --- Ajustes Móviles --- */
@media(max-width:1000px){

font-size: 16px;
margin-top: 10px;
}
.scroll-indicator { display: none !important; }
.main-content { grid-template-columns: 1fr; padding: 30px 20px; }
}

.releases-section {

.releases-title {
font-family: 'RelicusMono', monospace !important;
font-weight: 900 !important;
font-size: clamp(32px, 6vw, 64px);
color: #ffffff;
margin: 0 0 30px 0;
letter-spacing: -1px;
text-transform: none !important;
text-align: left !important;
}

.releases-title::after {
content: '';
display: block;
width: 60px;
height: 3px;
background: #ffffff;
margin: 12px 0 0 0;
}

/* --- Grid de 4 Lanzamientos Horizontales --- */
.releases-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 24px;
margin-top: 30px;
}

/* --- Tarjeta de Lanzamiento --- */
.release-card {
position: relative;
display: block;
text-decoration: none;
border-radius: 12px;
overflow: hidden;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.1);
transform: none !important;
transition: border-color 0.3s ease, box-shadow 0.3s ease !important;
}

/* --- Contenedor e Imagen de Portada (Bloqueo de zoom en Carrd) --- */
.release-cover-wrapper {
position: relative;
width: 100%;
padding-top: 100%;
overflow: hidden;
}

.release-cover {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
object-fit: cover;
transform: none !important;
transition: none !important;
scale: 1 !important;
}

/* Forzar la desactivación de zoom en hover */
.release-card:hover .release-cover,
.release-cover:hover,
a:hover .release-cover {
transform: none !important;
scale: 1 !important;
}

/* --- Info (Solo nombre del track) --- */
.release-info {
padding: 16px 12px;
text-align: left;
background: rgba(0, 0, 0, 0.4);
backdrop-filter: blur(5px);
}

.release-name {
font-family: 'RelicusMono', monospace !important;
font-size: 16px;
font-weight: 700;
color: #ffffff;
margin: 0;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

/* --- Animación de Entrada --- */
@keyframes fadeUpReleases {
0% { opacity: 0; transform: translateY(30px); }
100% { opacity: 1; transform: translateY(0); }
}

/* --- Ajustes Responsivos --- */
@media (max-width: 900px) {
.releases-grid {
grid-template-columns: repeat(2, 1fr);
gap: 16px;
}
}

@media (max-width: 500px) {
.releases-grid {
grid-template-columns: repeat(2, 1fr);
gap: 12px;
}
.release-name { font-size: 14px; }
.release-info { padding: 10px 8px; }
}

        function initMenu() {

            if (document.body && menu.parentElement !== document.body) document.body.appendChild(menu);

                if (!menu.classList.contains('menu-open')) return;

                if (relWrap) relWrap.classList.remove('submenu-open');

                    relWrap.classList.toggle('submenu-open');

                e.preventDefault(); e.stopPropagation();
                menu.classList.contains('menu-open') ? cerrarMenu() : abrirMenu();

            if (overlay) overlay.onclick = (e) => { e.stopPropagation(); cerrarMenu(); };
            navLinks.forEach(l => l.onclick = () => cerrarMenu());

                } else {
                    timer = setTimeout(() => { void toggleBtn.offsetWidth; toggleBtn.classList.add('animar-entrada'); }, 400);
                }
            }

            window.addEventListener('popstate', animar);
            animar();
        }
