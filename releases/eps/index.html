<style>
/* --- 📦 CARGA DE FUENTE PERSONALIZADA DESDE CLOUDINARY --- */
@font-face {
font-family: 'RelicusMono';
src: url('https://res.cloudinary.com/dfhrxq0tf/raw/upload/v1784479120/Relicus-Mono_rsjgnn.ttf') format('truetype');
font-weight: normal;
font-style: normal;
}

/* Fondo general de la página */
body {
background-color: #F5260A;
margin: 0;
font-family: 'RelicusMono', monospace;
}

/* --- ✨ RESALTADOR DE TEXTO (SELECTION) --- */
*::selection,
::selection {
background-color: #fae100; /* Color amarillo neón */
color: #030303; /* Color de texto oscuro */
}

/* --- 🌐 ESTILOS DEL MENÚ GLOBAL --- */
.mophra-global-container {
position: relative;
z-index: 9999;
}
.mophra-global-btn {
background: none;
border: none;
cursor: pointer;
padding: 10px;
position: fixed;
top: 20px;
left: 20px;
z-index: 10000;
}
.mophra-svg-element {
width: 40px;
height: 40px;
transition: transform 0.3s ease;
}
.mophra-global-btn:hover .mophra-svg-element {
transform: rotate(90deg);
}
.mophra-signs-nav {
display: none; /* Lógica de despliegue según tus scripts */
position: fixed;
top: 70px;
left: 20px;
background: rgba(0, 0, 0, 0.85);
padding: 15px;
border-radius: 10px;
flex-direction: column;
gap: 10px;
backdrop-filter: blur(5px);
}
.mophra-sign-item, .mophra-sub-item {
color: #ffffff;
text-decoration: none;
font-size: 16px;
font-weight: bold;
transition: opacity 0.2s;
}
.mophra-sign-item:hover, .mophra-sub-item:hover {
opacity: 0.7;
}
.mophra-submenu {
display: flex;
flex-direction: column;
padding-left: 15px;
gap: 8px;
margin-top: 5px;
}

/* --- ⌨️ EFECTO TYPEWRITER --- */
.mophra-tw-container {
width: 100%;
max-width: 620px;
margin: 40px auto 20px auto;
text-align: center;
padding: 0 10px;
box-sizing: border-box;
}

.mophra-line-wrap {
display: inline-flex;
align-items: center;
justify-content: center;
}

.mophra-typewriter-eps {
font-family: 'RelicusMono', monospace !important;
font-size: 32px;
line-height: 1.2;
color: #ffffff;
font-weight: 600;
white-space: nowrap;
overflow: hidden;
display: inline-flex;
align-items: center;
max-width: 0;
animation: mophraTypewriterEPs 0.25s steps(3, end) 0.3s forwards;
}

.mophra-typewriter-eps::after {
content: '▋';
display: inline-block;
color: #ffffff;
font-size: 26px;
margin-left: 4px;
opacity: 1;
animation: mophraBlink 0.5s step-end infinite 0.3s;
}

@keyframes mophraTypewriterEPs {
from { max-width: 0; }
to { max-width: 90px; }
}

@keyframes mophraBlink {
0%, 100% { opacity: 1; }
50% { opacity: 0; }
}

@media (min-width: 480px) {
.mophra-typewriter-eps { font-size: 38px; }
.mophra-typewriter-eps::after { font-size: 30px; }
@keyframes mophraTypewriterEPs {
from { max-width: 0; }
to { max-width: 110px; }
}
}

@media (min-width: 769px) {
.mophra-typewriter-eps { font-size: 54px; }
.mophra-typewriter-eps::after { font-size: 42px; }
@keyframes mophraTypewriterEPs {
from { max-width: 0; }
to { max-width: 160px; }
}
}
</style>
