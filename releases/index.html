<head>
  <meta charset="UTF-8">

  <style>
    @font-face {
      font-family: 'RelicusMono';
      src: url('https://res.cloudinary.com/dfhrxq0tf/raw/upload/v1784479120/Relicus-Mono_rsjgnn.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #F5260A; /* Fondo rojo del sello */
      color: #ffffff;
      font-family: 'RelicusMono', monospace;
      min-height: 100vh;
      overflow-x: hidden !important;
    }

    /* CONTENEDOR PRINCIPAL */
    .releases-wrapper {
      max-width: 1200px; /* Aumenté el ancho máximo para la galería */
      margin: 0 auto;
      padding: 40px 20px 80px 20px;
    }

    /* ---------------------------------- */
    /* 1. TÍTULO ENTRADA                 */
    /* ---------------------------------- */
    .title-entrance-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 60px 0;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* 1. CONFIGURACIÓN BASE (PARA MÓVIL) */
    .animated-title-image {
      width: 75%;
      max-width: 360px;
      height: auto;
      display: block;
      opacity: 0;
      animation: dropIn 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
      animation-delay: 0.5s;
    }

    /* 2. CONFIGURACIÓN EXCLUSIVA PARA PC (Pantallas grandes) */
    @media (min-width: 769px) {
      .animated-title-image {
        max-width: 720px;
      }
    }

    /* Definición de la animación 'dropIn' */
    @keyframes dropIn {
      0% {
        opacity: 0;
        transform: translateY(-80px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------------------------------- */
    /* 2. GALERÍA DE LANZAMIENTOS (NUEVO) */
    /* ---------------------------------- */
    .releases-grid {
      display: grid;
      gap: 30px; /* Espacio entre tarjetas */
      margin-top: 40px;
    }

    /* CONFIGURACIÓN PARA MÓVIL (1 columna - por defecto) */
    .release-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.3s ease;
    }

    .release-card:hover {
      transform: translateY(-5px); /* Pequeño efecto al pasar el ratón */
    }

    /* Contenedor gris de la portada */
    .cover-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1; /* Mantiene el cuadrado perfecto */
      background-color: #e0e0e0; /* Gris de fondo tipo póster */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 2px solid #e0e0e0; /* Borde sutil */
    }

    /* Imagen dentro del recuadro */
    .cover-image {
      width: 90%; /* La imagen no toca los bordes */
      height: 90%;
      object-fit: cover; /* Ajusta la imagen sin deformarla */
    }

    /* Título del tema abajo */
    .release-title {
      margin-top: 15px;
      font-size: 16px; /* Ajusta el tamaño según prefieras */
      text-align: center;
      text-transform: uppercase;
      width: 100%;
      word-wrap: break-word;
    }

    /* TABLET (2 columnas) */
    @media (min-width: 600px) {
      .releases-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* PC (3 columnas) */
    @media (min-width: 1024px) {
      .releases-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
