<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOPHRA | Albums</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        /* --- 🎨 ESTILOS GENERALES Y FONDO --- */
        body {
            background-color: #F5260A !important;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- 📦 CARGA DE FUENTE PERSONALIZADA DESDE CLOUDINARY --- */
        @font-face {
            font-family: 'RelicusMono';
            src: url('https://res.cloudinary.com/dfhrxq0tf/raw/upload/v1784479120/Relicus-Mono_rsjgnn.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Contenedor principal */
        .mophra-tw-container {
            width: 100%;
            max-width: 620px;
            margin: 100px auto 20px auto;
            text-align: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Envoltorio centrado */
        .mophra-line-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* ⌨️ Typewrite paso a paso (6 letras = 6 pasos) */
        .mophra-typewriter-albums {
            font-family: 'RelicusMono', monospace !important;
            font-size: 36px;
            line-height: 1.2;
            color: #ffffff;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            max-width: 0;
            animation: mophraTypewriterAlbums 0.45s steps(6, end) 0.3s forwards;
        }

        /* 🔦 Cursor block */
        .mophra-typewriter-albums::after {
            content: '▋';
            display: inline-block;
            color: #ffffff;
            font-size: 30px;
            margin-left: 4px;
            opacity: 1;
            animation: mophraBlink 0.5s step-end infinite 0.3s;
        }

        /* Ancho máximo inicial (Móvil) */
        @keyframes mophraTypewriterAlbums {
            from { max-width: 0; }
            to { max-width: 160px; }
        }

        @keyframes mophraBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Responsivo Tablet */
        @media (min-width: 480px) {
            .mophra-typewriter-albums { font-size: 38px; }
            .mophra-typewriter-albums::after { font-size: 30px; }
            @keyframes mophraTypewriterAlbums {
                from { max-width: 0; }
                to { max-width: 190px; }
            }
        }

        /* Responsivo PC (TAMAÑO AUMENTADO) */
        @media (min-width: 769px) {
            .mophra-typewriter-albums { font-size: 54px; }
            .mophra-typewriter-albums::after { font-size: 42px; }
            @keyframes mophraTypewriterAlbums {
                from { max-width: 0; }
                to { max-width: 280px; }
            }
        }
    </style>
</head>
<body>

    <style>
        .mophra-global-container {
            position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
            width: 100% !important; height: 100vh !important;
            background-color: transparent !important;
            overflow: hidden !important;
            overflow-x: hidden !important;
            font-family: 'RelicusMono', monospace !important; user-select: none !important; z-index: 999999 !important; pointer-events: none !important;
        }

        @keyframes entradaBoton { 0% { transform: translateY(-100px); opacity: 0; } 70% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes salidaBoton { 0% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }

        .mophra-global-btn {

    </style>

    <script>
    (function() {
        if (!document.getElementById('mophra-global-selection-style')) {
            const selectionStyle = document.createElement('style');
            selectionStyle.id = 'mophra-global-selection-style';
            selectionStyle.innerHTML = `
                *::selection, ::selection {
                    background-color: #fae100 !important;
                    color: #030303 !important;
                }
            `;

        function initMenu() {
            const menu = document.getElementById('mophraGlobalMenu');
            if (!menu) return;
            if (document.body && menu.parentElement !== document.body) document.body.appendChild(menu);

            const toggleBtn = menu.querySelector('.mophra-global-btn');
            const vectorPath = document.getElementById('mophraVectorPath');
            const overlay = menu.querySelector('.mophra-global-overlay');
            const navLinks = menu.querySelectorAll('.mophra-sign-link, a.mophra-sign-item, .mophra-sub-item');
            const relToggle = document.getElementById('mophraReleasesToggle');
            const relWrap = relToggle ? relToggle.closest('.mophra-dropdown-wrapper') : null;

            if (!toggleBtn || !vectorPath) return;

            function abrirMenu() {
                menu.classList.add('menu-open');
                setTimeout(() => vectorPath.setAttribute('d', PATH_X), 200);
            }

            function cerrarMenu() {
                if (!menu.classList.contains('menu-open')) return;
                menu.classList.remove('menu-open');
                if (relWrap) relWrap.classList.remove('submenu-open');
                setTimeout(() => vectorPath.setAttribute('d', PATH_LOGO), 200);
            }

            if (relToggle && relWrap) {
                relToggle.onclick = (e) => {
                    e.preventDefault(); e.stopPropagation();
                    relWrap.classList.toggle('submenu-open');
                };
            }

            toggleBtn.onclick = (e) => {
                e.preventDefault(); e.stopPropagation();
                menu.classList.contains('menu-open') ? cerrarMenu() : abrirMenu();
            };

            if (overlay) overlay.onclick = (e) => { e.stopPropagation(); cerrarMenu(); };
            navLinks.forEach(l => l.onclick = () => cerrarMenu());

            let timer;
            function animar() {
                cerrarMenu(); clearTimeout(timer);
                if (toggleBtn.classList.contains('animar-entrada')) {
                    toggleBtn.classList.remove('animar-entrada');
                    toggleBtn.classList.add('animar-salida');
                    timer = setTimeout(() => {
                        toggleBtn.classList.remove('animar-salida');
                        void toggleBtn.offsetWidth;
                        toggleBtn.classList.add('animar-entrada');
                    }, 450);
                } else {
                    timer = setTimeout(() => { void toggleBtn.offsetWidth; toggleBtn.classList.add('animar-entrada'); }, 400);
                }
            }

            window.addEventListener('popstate', animar);
            animar();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initMenu);
        else initMenu();
