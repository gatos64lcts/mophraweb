    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
      setInterval(async () => {
        try {
          const response = await fetch('./version.json?_=' + Date.now());
          const data = await response.json();
          const currentVersion = localStorage.getItem('mophra_version');
          
          if (!currentVersion) {
            localStorage.setItem('mophra_version', data.version);
          } else if (currentVersion !== data.version) {
            localStorage.setItem('mophra_version', data.version);
            window.location.reload();
          }
        } catch (err) {
          // Silenciar errores de conexión temporal
        }
      }, 60000);
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BADDy - My Last Sound</title>

    <style>
      @font-face {
        font-family: 'RelicusMono';
        src: url('../../../resources/relicus-mono.ttf') format('woff2'),
             url('../../../resources/relicus-mono.ttf') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

        /* --- 🎨 ESTILOS GENERALES Y FONDO --- */
        body {
            background-color: #0d0d0d !important;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* --- 💿 DISCO FIJO AL CENTRO (Optimizado para móviles) --- */
        .mophra-fixed-disc-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            pointer-events: none;
            box-sizing: border-box;
            contain: layout style paint;
        }

        .mophra-rotating-image-wrap {
            width: 450px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Quitamos 'infinite' y 'paused' por defecto para que inicie estático */
            animation: mophraRotate360 10s linear infinite;
            animation-play-state: paused; 
            backface-visibility: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        /* Clase que activaremos con JS cuando empiece a sonar la música */
        .mophra-rotating-image-wrap.is-spinning {
            animation-play-state: running;
        }

        .mophra-rotating-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        @keyframes mophraRotate360 {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @media (min-width: 840px) {
            .mophra-rotating-image-wrap { 
                width: 720px; 
                height: 720px; 
            }
            .mophra-fixed-disc-container {
                transform: translateX(190px);
            }
        }

        /* --- 📜 CONTENEDOR PRINCIPAL DE CONTENIDO --- */
        .mophra-content-flow {
            position: relative;
            z-index: 3;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-sizing: border-box;
            padding: 0 50px 80px 50px;
        }

        /* --- 📝 TÍTULO PRINCIPAL --- */
        .mophra-bottom-title-container {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 10px;
        }

        .mophra-bottom-title {
            font-family: 'RelicusMono', monospace !important;
            color: #ffffff;
            font-size: clamp(65px, 15vw, 180px);
            font-weight: 900;
            text-transform: none !important;
            letter-spacing: -1px;
            background: none !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            line-height: 1;
        }

        /* --- 🖼️ CONTENEDOR DE LA IMAGEN INTERMEDIA --- */
        .mophra-middle-image-container {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        .mophra-middle-image-container img {
            width: 100%;
            max-width: 396px;
            height: auto;
            border-radius: 2px;
            object-fit: contain;
            box-shadow: 0 10px 10px rgba(0,0,0,0.2);
        }

        /* --- 🎵 SECCIÓN DE DETALLES (TRACKLIST) --- */
        .mophra-details-section {
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }

        .mophra-release-content {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
            max-width: 650px;
        }

        .mophra-details-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            align-items: flex-start;
        }

        .mophra-tracklist-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: flex-start;
        }

       .mophra-tracklist-header-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 550px;
            margin-bottom: 15px;
        }

        .mophra-tracklist-heading {
            font-family: 'RelicusMono', monospace !important;
            color: #ffffff;
            font-size: clamp(24px, 3.4vw, 46px);
            font-weight: 900;
            text-transform: none !important;
            margin-bottom: 0 !important;
            letter-spacing: -1px;
            text-align: left;
        }

        /* --- 🎛️ ESTILOS PARA TRACK ITEMS (SIN EFECTO DE DESPLAZAMIENTO EN HOVER) --- */
        .mophra-track-item {
            font-family: 'RelicusMono', monospace !important;
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(14px, 1.5vw, 19px);
            font-weight: 700;
            text-transform: none !important;
            padding: 8px 0;
            width: 100%;
            max-width: 550px;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 15px !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            transition: color 0.2s ease;
        }

        .mophra-track-item:hover {
            color: #ffffff;
        }

        .mophra-track-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .mophra-play-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            transition: all 0.2s ease;
            padding: 0;
            flex-shrink: 0;
        }

        .mophra-play-btn:hover {
            background: #ffffff;
            color: #0d0d0d;
            border-color: #ffffff;
            transform: scale(1.1);
        }

        .mophra-track-name {
            flex-grow: 1;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .track-marquee-wrapper {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            display: block;
            position: relative;
            box-sizing: border-box;
            flex-grow: 1;
            min-width: 0;
        }

        .track-marquee-inner {
            display: inline-block;
            white-space: nowrap;
            width: max-content;
        }

        /* Usamos 'alternate' para el rebote continuo */
        .track-marquee-wrapper.is-overflowing .track-marquee-inner {
            animation: mophraBounceMarquee ease-in-out infinite alternate;
        }

        @keyframes mophraBounceMarquee {
            0%, 15% {
                transform: translateX(0);
            }
            85%, 100% {
                transform: translateX(var(--bounce-distance, 0px));
            }
        }
        
        .mophra-progress-container {
            width: 110px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .mophra-progress-bar {
            height: 100%;
            width: 0%;
            background: #ffffff;
            transition: width 0.1s linear;
        }

        /* --- 🔘 BOTÓN STREAM / DL --- */
        .mophra-media-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            margin-top: 5px;
        }

        .mophra-stream-btn {
            font-family: 'RelicusMono', monospace !important;
            background-color: #ffffff;
            color: #F5260A;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 900;
            text-decoration: none;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: -1px;
            transition: background 0.3s, transform 0.3s;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .mophra-stream-btn:hover {
            background-color: #f22307;
            color: #0f0f0f;
            transform: scale(1.03);
        }

        @media (max-width: 900px) {
            .mophra-content-flow { padding: 0 20px 50px 20px; }
            .mophra-middle-image-container img {
                max-width: 320px;
            }
        }

        @media (max-width: 768px) {
            .mophra-bottom-title {
                font-size: clamp(60px, 12vw, 200px) !important;
            }
            .mophra-progress-container {
                width: 70px;
            }
        }
    </style>
</head>

        .mophra-global-container {

        @keyframes salidaBoton { 0% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }

        .mophra-global-btn {
            position: fixed !important; top: 30px !important; right: 30px !important; z-index: 1000000 !important;
            background: rgba(255, 255, 255, 0.1) !important; border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 50% !important; width: 70px !important; height: 70px !important; cursor: pointer !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            backdrop-filter: blur(5px) !important; pointer-events: auto !important; padding: 0 !important; opacity: 0 !important;
            transition: background 0.3s, transform 0.3s !important;
        }

        .mophra-global-btn.animar-entrada { opacity: 1 !important; animation: entradaBoton 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
        .mophra-global-btn.animar-salida { opacity: 1 !important; animation: salidaBoton 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
        .mophra-global-btn:hover { background: rgba(255, 255, 255, 0.25) !important; transform: scale(1.05) !important; }

        .mophra-global-container.menu-open { pointer-events: auto !important; }

        function initMenu() {
            const menu = document.getElementById('mophraGlobalMenu');
            if (!menu) return;
            if (document.body && menu.parentElement !== document.body) document.body.appendChild(menu);

            const toggleBtn = menu.querySelector('.mophra-global-btn');
            const vectorPath = document.getElementById('mophraVectorPath');
            const overlay = menu.querySelector('.mophra-global-overlay');
            const navLinks = menu.querySelectorAll('.mophra-sign-link, a.mophra-sign-item, .mophra-sub-item');
            const relToggle = document.getElementById('mophraReleasesToggle');
            const relWrap = relToggle ? relToggle.closest('.mophra-dropdown-wrapper') : null;

            if (!toggleBtn || !vectorPath) return;

            function abrirMenu() {
                menu.classList.add('menu-open');
                setTimeout(() => vectorPath.setAttribute('d', PATH_X), 200);
            }

            function cerrarMenu() {
                if (!menu.classList.contains('menu-open')) return;
                menu.classList.remove('menu-open');
                if (relWrap) relWrap.classList.remove('submenu-open');
                setTimeout(() => vectorPath.setAttribute('d', PATH_LOGO), 200);
            }

            if (relToggle && relWrap) {
                relToggle.onclick = (e) => {
                    e.preventDefault(); e.stopPropagation();
                    relWrap.classList.toggle('submenu-open');
                };
            }

            toggleBtn.onclick = (e) => {
                e.preventDefault(); e.stopPropagation();
                menu.classList.contains('menu-open') ? cerrarMenu() : abrirMenu();
            };

            if (overlay) overlay.onclick = (e) => { e.stopPropagation(); cerrarMenu(); };
            navLinks.forEach(l => l.onclick = () => cerrarMenu());

            let timer;
            function animar() {
                cerrarMenu(); clearTimeout(timer);
                if (toggleBtn.classList.contains('animar-entrada')) {
                    toggleBtn.classList.remove('animar-entrada');
                    toggleBtn.classList.add('animar-salida');
                    timer = setTimeout(() => {
                        toggleBtn.classList.remove('animar-salida');
                        void toggleBtn.offsetWidth;
                        toggleBtn.classList.add('animar-entrada');
                    }, 450);
                } else {
                    timer = setTimeout(() => { void toggleBtn.offsetWidth; toggleBtn.classList.add('animar-entrada'); }, 400);
                }
            }

            window.addEventListener('popstate', animar);
            animar();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initMenu);
        else initMenu();

    <style>
        
        .cortina-contenedor {
            position: fixed;
            top: -15vh;
            left: 0;
            width: 100vw;
            height: 115vh;
            background-color: #1a1a1a;
            z-index: 2147483647 !important; /* El valor máximo absoluto del navegador */

            overflow: hidden;
            pointer-events: auto; /* Permite bloquear clics en la capa superior */

        }

        .cortina-contenedor.cerrar {
            pointer-events: auto;
            transform: translateY(0%);
            transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.05) !important;
        }

        .cortina-contenedor.abrir {
            transform: translateY(-100%);
            transition: transform 0.7s cubic-bezier(0.6, -0.28, 0.735, 0.045) !important;
        }

            height: 100%;
            object-fit: cover;
        }

    <script>
        (function() {
            document.getElementById('mophraGlobalMenu').style.display = 'none';
            const cortina = document.getElementById('cortina-transicion');

            function abrirCortina() {
                if (cortina) {
                    cortina.classList.remove('cerrar');
                    cortina.classList.add('abrir');
                }
            }

            window.addEventListener('load', () => {
                setTimeout(abrirCortina, 100);
            });

            window.addEventListener('pageshow', (event) => {
                if (event.persisted && cortina) {
                    cortina.classList.remove('cerrar');
                    cortina.classList.add('abrir');
                }
            });

            document.addEventListener('click', (e) => {
                const link = e.target.closest('a');
                if (!link) return;

                const href = link.getAttribute('href');
                if (href && (href.startsWith('/') || href.startsWith('.')) && !link.getAttribute('target') && !link.hasAttribute('download')) {
                    e.preventDefault();
                    
                    if (cortina) {
                        cortina.classList.remove('abrir');
                        cortina.classList.add('cerrar');
                    }

                    setTimeout(() => {
                        window.location.href = href;
                    }, 500);
                }
            });
        })();

       /* --- 🎵 SCRIPT DE REPRODUCTOR DE AUDIO GLOBAL (REGLA DE UNA SOLA PISTA) --- */
        document.addEventListener('DOMContentLoaded', () => {
            const trackItems = document.querySelectorAll('.mophra-track-item');
            const discWrap = document.querySelector('.mophra-rotating-image-wrap'); // Referencia al contenedor del disco
            let currentAudio = null;
            let currentPlayBtn = null;
            let currentProgressBar = null;
            let progressInterval = null;

            trackItems.forEach(item => {
                const audioSrc = item.getAttribute('data-src');
                const playBtn = item.querySelector('.mophra-play-btn');
                const progressBar = item.querySelector('.mophra-progress-bar');
                const progressContainer = item.querySelector('.mophra-progress-container');

                if (!audioSrc) return;

                const audio = new Audio(audioSrc);

                playBtn.addEventListener('click', () => {
                    // Si hay otro audio sonando, se pausa y se resetea por completo
                    if (currentAudio && currentAudio !== audio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                        if (currentPlayBtn) currentPlayBtn.textContent = '▶';
                        if (currentProgressBar) currentProgressBar.style.width = '0%';
                        clearInterval(progressInterval);
                    }

                    if (audio.paused) {
                        audio.play().then(() => {
                            playBtn.textContent = '❚❚';
                            currentAudio = audio;
                            currentPlayBtn = playBtn;
                            currentProgressBar = progressBar;

                            // Hacemos que el disco empiece a girar
                            if (discWrap) discWrap.classList.add('is-spinning');

                            clearInterval(progressInterval);
                            progressInterval = setInterval(() => {
                                if (audio.duration) {
                                    const percentage = (audio.currentTime / audio.duration) * 100;
                                    progressBar.style.width = percentage + '%';
                                }
                            }, 100);
                        }).catch(err => console.log("Error al reproducir audio:", err));
                    } else {
                        audio.pause();
                        playBtn.textContent = '▶';
                        
                        // Pausamos el giro del disco manteniendo su posición actual
                        if (discWrap) discWrap.classList.remove('is-spinning');

                        clearInterval(progressInterval);
                    }
                });

                audio.addEventListener('ended', () => {
                    playBtn.textContent = '▶';
                    progressBar.style.width = '0%';
                    
                    // Detenemos el disco al terminar la pista
                    if (discWrap) discWrap.classList.remove('is-spinning');

                    clearInterval(progressInterval);
                });

                // Control manual de la barra de progreso al hacer clic
                progressContainer.addEventListener('click', (e) => {
                    if (!audio.duration) return;
                    const rect = progressContainer.getBoundingClientRect();
                    const clickPosition = (e.clientX - rect.left) / rect.width;
                    audio.currentTime = clickPosition * audio.duration;
                    progressBar.style.width = (clickPosition * 100) + '%';
                });
            });
        });
       document.addEventListener('DOMContentLoaded', () => {
        const wrappers = document.querySelectorAll('.track-marquee-wrapper');
        
        wrappers.forEach(wrapper => {
            const inner = wrapper.querySelector('.track-marquee-inner');
            if (!inner) return;
            
            const textWidth = inner.scrollWidth;
            const containerWidth = wrapper.clientWidth;
            
            if (textWidth > containerWidth) {
                wrapper.classList.add('is-overflowing');
                const distance = containerWidth - textWidth;
                inner.style.setProperty('--bounce-distance', distance + 'px');
                
                // Tiempo que tarda el texto en desplazarse de un lado a otro (ej. 3 segundos de viaje)
                const travelTime = Math.max(2.5, Math.abs(distance) * 0.025);
                
                // Si el 15% del tiempo total representa la pausa, calculamos el total sumando los 2 segundos exactos de pausa
                // Fórmula: Duración del viaje + 2 segundos de pausa en cada extremo
                const totalDuration = travelTime + 2.0; 
                
                inner.style.animationDuration = totalDuration + 's';
            } else {
                wrapper.classList.remove('is-overflowing');
                inner.style.removeProperty('--bounce-distance');
                inner.style.removeProperty('animation-duration');
            }
        });
    });
    </script>
