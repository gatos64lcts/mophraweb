    <!-- 1. Etiquetas para mitigar la caché del navegador -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- 2. Script de auto-recarga global -->
<script>
  setInterval(async () => {
    try {
      const response = await fetch('./version.json?_=' + Date.now());
      const data = await response.json();
      const currentVersion = localStorage.getItem('mophra_version');
      
      if (!currentVersion) {
        localStorage.setItem('mophra_version', data.version);
      } else if (currentVersion !== data.version) {
        localStorage.setItem('mophra_version', data.version);
        window.location.reload();
      }
    } catch (err) {
      // Silenciar errores de conexión temporal
    }
  }, 60000);
</script>

            height: auto;

    <script>
        (function() {
            const cortina = document.getElementById('cortina-transicion');

            function abrirCortina() {
                if (cortina) {
                    cortina.classList.remove('cerrar');
                    cortina.classList.add('abrir');
                }
            }

            window.addEventListener('load', () => {
                setTimeout(abrirCortina, 100);
            });

            window.addEventListener('pageshow', (event) => {
                if (event.persisted && cortina) {
                    cortina.classList.remove('cerrar');
                    cortina.classList.add('abrir');
                }
            });

            document.addEventListener('click', (e) => {
                const link = e.target.closest('a');
                if (!link) return;

                const href = link.getAttribute('href');
                if (href && (href.startsWith('/') || href.startsWith('.')) && !link.getAttribute('target') && !link.hasAttribute('download')) {
                    e.preventDefault();
                    
                    if (cortina) {
                        cortina.classList.remove('abrir');
                        cortina.classList.add('cerrar');
                    }

                    setTimeout(() => {
                        window.location.href = href;
                    }, 500);
                }
            });
        })();
